name: Verify Brick Buddy

on:
  push:
    branches:
      - build/storefront-v1
      - feature/phase1-preorder
      - feature/launch-ready
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Test
        run: npm test

      - name: Production build
        run: npm run build
